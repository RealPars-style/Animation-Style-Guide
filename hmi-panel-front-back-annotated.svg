<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title>HMI panel front, back and side view</title>
  <desc>Front and back of an HMI panel, plus a side view of the panel mounted in a cabinet door. Callouts show the sealed front face, the front gasket, the door cutout, the mounting clamps, the 24 VDC power terminal and the Ethernet ports.</desc>
  <defs>
    <style>
      .h { font-size: 22px; font-weight: 600; fill: #1d1d1f; letter-spacing: -0.3px; text-anchor: middle; }
      .lbl { font-size: 16px; font-weight: 600; fill: #1d1d1f; letter-spacing: -0.2px; }
      .sub { font-size: 14px; font-weight: 400; fill: #6e6e73; letter-spacing: -0.15px; }
      .tiny { font-size: 13px; font-weight: 400; fill: #86868b; letter-spacing: -0.1px; }
      .lead { stroke: #1d1d1f; stroke-width: 1; fill: none; }
    </style>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c2e"/>
      <stop offset="1" stop-color="#1d1d1f"/>
    </linearGradient>
    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ececf0"/>
      <stop offset="1" stop-color="#dcdce1"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#f5f5f7"/>

  <!-- ===================== FRONT ===================== -->
  <text class="h" x="300" y="118">Front</text>

  <rect x="70" y="190" width="460" height="320" rx="18" fill="url(#bezel)"/>
  <rect x="94" y="212" width="412" height="262" rx="6" fill="#fbfbfd"/>
  <g stroke="#d2d2d7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="140" y="254" width="66" height="112" rx="8"/>
    <path d="M 206 342 H 276"/>
    <circle cx="296" cy="342" r="20"/>
    <path d="M 316 342 H 376 V 272 H 440"/>
  </g>
  <rect x="142.5" y="312" width="61" height="51.5" rx="6" fill="#e8e8ed"/>
  <g fill="none" stroke="#e5e5ea" stroke-width="2">
    <rect x="128" y="404" width="68" height="40" rx="8"/>
    <rect x="208" y="404" width="68" height="40" rx="8"/>
    <rect x="404" y="404" width="68" height="40" rx="8"/>
  </g>
  <rect x="276" y="490" width="48" height="4" rx="2" fill="#48484a"/>

  <path class="lead" d="M 300 510 V 612"/>
  <circle cx="300" cy="510" r="4" fill="#1d1d1f" stroke="#f5f5f7" stroke-width="2"/>
  <text class="lbl" x="300" y="640" text-anchor="middle">Sealed front face</text>
  <text class="sub" x="300" y="662" text-anchor="middle">Check the front IP rating</text>

  <!-- ===================== BACK ===================== -->
  <text class="h" x="870" y="118">Back</text>

  <rect x="640" y="190" width="460" height="320" rx="18" fill="#ededf0" stroke="#d2d2d7" stroke-width="1"/>
  <rect x="680" y="220" width="380" height="260" rx="12" fill="url(#housing)" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="712" y="248" width="140" height="62" rx="6" fill="#f5f5f7"/>

  <g fill="#8e8e93">
    <rect x="754" y="195" width="32" height="14" rx="4"/>
    <rect x="954" y="195" width="32" height="14" rx="4"/>
    <rect x="754" y="491" width="32" height="14" rx="4"/>
    <rect x="954" y="491" width="32" height="14" rx="4"/>
    <rect x="646" y="334" width="14" height="32" rx="4"/>
    <rect x="1080" y="334" width="14" height="32" rx="4"/>
  </g>

  <rect x="716" y="392" width="308" height="60" rx="8" fill="#d1d1d6"/>
  <rect x="730" y="402" width="92" height="40" rx="5" fill="#3a3a3c"/>
  <g fill="#c7c7cc">
    <circle cx="747" cy="422" r="8"/>
    <circle cx="776" cy="422" r="8"/>
    <circle cx="805" cy="422" r="8"/>
  </g>
  <g stroke="#3a3a3c" stroke-width="2" stroke-linecap="round">
    <path d="M 742 422 H 752 M 771 422 H 781 M 800 422 H 810"/>
  </g>
  <rect x="852" y="404" width="42" height="36" rx="5" fill="#1d1d1f"/>
  <rect x="862" y="413" width="22" height="16" rx="2" fill="#3a3a3c"/>
  <rect x="904" y="404" width="42" height="36" rx="5" fill="#1d1d1f"/>
  <rect x="914" y="413" width="22" height="16" rx="2" fill="#3a3a3c"/>
  <rect x="966" y="414" width="38" height="14" rx="3" fill="#1d1d1f"/>

  <path class="lead" d="M 776 442 V 612"/>
  <circle cx="776" cy="442" r="4" fill="#1d1d1f" stroke="#f5f5f7" stroke-width="2"/>
  <text class="lbl" x="776" y="640" text-anchor="middle">24 VDC power</text>
  <text class="sub" x="776" y="662" text-anchor="middle">Check the supply voltage</text>

  <path class="lead" d="M 899 440 V 560 H 1000 V 612"/>
  <circle cx="899" cy="440" r="4" fill="#1d1d1f" stroke="#f5f5f7" stroke-width="2"/>
  <text class="lbl" x="1000" y="640" text-anchor="middle">Ethernet ports</text>
  <text class="sub" x="1000" y="662" text-anchor="middle">Check your PLC protocol</text>

  <path class="lead" d="M 1094 350 H 1114"/>
  <circle cx="1094" cy="350" r="4" fill="#1d1d1f" stroke="#f5f5f7" stroke-width="2"/>
  <text class="sub" x="1120" y="346">Mounting</text>
  <text class="sub" x="1120" y="364">clamps</text>

  <!-- ===================== SIDE ===================== -->
  <text class="h" x="1380" y="118">Side</text>

  <rect x="1336" y="200" width="8" height="70" rx="1" fill="#aeaeb2"/>
  <rect x="1336" y="510" width="8" height="250" rx="1" fill="#aeaeb2"/>
  <rect x="1302" y="230" width="20" height="330" rx="5" fill="url(#bezel)"/>
  <rect x="1322" y="236" width="14" height="26" rx="2" fill="#48484a"/>
  <rect x="1322" y="528" width="14" height="26" rx="2" fill="#48484a"/>
  <rect x="1344" y="276" width="118" height="228" rx="10" fill="url(#housing)" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M 1344 254 H 1372 V 276" fill="none" stroke="#636366" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1344 536 H 1372 V 504" fill="none" stroke="#636366" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1462 452 C 1496 452 1500 510 1516 560" fill="none" stroke="#aeaeb2" stroke-width="4" stroke-linecap="round"/>
  <path d="M 1462 422 C 1504 422 1514 480 1536 540" fill="none" stroke="#48484a" stroke-width="4" stroke-linecap="round"/>

  <path class="lead" d="M 1329 249 L 1300 192 H 1252"/>
  <circle cx="1329" cy="249" r="4" fill="#1d1d1f" stroke="#f5f5f7" stroke-width="2"/>
  <text class="lbl" x="1252" y="182">Front gasket</text>

  <path d="M 1332 270 H 1350 M 1332 510 H 1350" stroke="#1d1d1f" stroke-width="1.5"/>
  <path class="lead" d="M 1350 510 V 634 H 1430"/>
  <circle cx="1350" cy="510" r="4" fill="#1d1d1f" stroke="#f5f5f7" stroke-width="2"/>
  <text class="lbl" x="1436" y="640">Door cutout</text>
  <text class="sub" x="1436" y="662">Match the panel's</text>
  <text class="sub" x="1436" y="680">cutout size</text>

  <text class="tiny" x="1316" y="800" text-anchor="end">Operator side</text>
  <text class="tiny" x="1364" y="800">Inside the cabinet</text>
</svg>
